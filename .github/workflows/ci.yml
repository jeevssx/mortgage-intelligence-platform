name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks over full history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          comment-summary-in-pr: on-failure

  database:
    name: Migrations + seed on fresh PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - name: Create roles and database
        env:
          PGUSER: postgres
          PGPASSWORD: ci-superuser-password
        run: psql -v ON_ERROR_STOP=1 -v owner_password=ci-owner -v app_password=ci-app -f database/schema/000_roles_and_database.sql
      - name: Apply migrations and seed
        env:
          POSTGRES_OWNER_PASSWORD: ci-owner
        run: bash database/scripts/reset-dev-db.sh
      - name: Migrations are idempotent
        env:
          PGUSER: mortgage_owner
          PGPASSWORD: ci-owner
          PGDATABASE: mortgage_intel
        run: for f in database/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Sample queries run as app role
        env:
          PGUSER: mortgage_app
          PGPASSWORD: ci-app
          PGDATABASE: mortgage_intel
        run: psql -v ON_ERROR_STOP=1 -f database/scripts/sample-queries.sql > /dev/null
      - name: Assert seed invariants
        env:
          PGUSER: mortgage_app
          PGPASSWORD: ci-app
          PGDATABASE: mortgage_intel
        run: |
          check() { got=$(psql -tAc "$1"); [ "$got" = "$2" ] || { echo "FAIL: $1 -> '$got' (expected '$2')"; exit 1; }; echo "ok: $1 = $2"; }
          check "SELECT status FROM mortgage WHERE mortgage_external_id='MTG-1001'" "ACTIVE"
          check "SELECT status FROM mortgage WHERE mortgage_external_id='MTG-1002'" "DELINQUENT"
          check "SELECT days_past_due FROM delinquency d JOIN mortgage m ON m.id=d.mortgage_id WHERE m.mortgage_external_id='MTG-1002'" "45"
          check "SELECT COUNT(*) FROM mortgage" "12"
          check "SELECT COUNT(*) FROM mortgage WHERE status='DELINQUENT'" "3"
          check "SELECT COUNT(*) FROM borrower" "8"

  analytics-service:
    name: Analytics service tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: analytics/mortgage-analytics-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analytics/mortgage-analytics-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Prepare database (roles, migrations, seed)
        working-directory: .
        env:
          PGHOST: localhost
        run: |
          PGUSER=postgres PGPASSWORD=ci-superuser-password psql -v ON_ERROR_STOP=1 -v owner_password=ci-owner -v app_password=ci-app -f database/schema/000_roles_and_database.sql
          POSTGRES_OWNER_PASSWORD=ci-owner bash database/scripts/reset-dev-db.sh
      - name: Tests (unit, API, S3, DB integration) with coverage gate
        env:
          INTEGRATION_DB: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PASSWORD: ci-app
        run: |
          pytest -v --cov=src --cov-report=term-missing --cov-report=xml
          python -m coverage report --include="src/analytics/*,src/services/*" --fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-coverage
          path: analytics/mortgage-analytics-service/coverage.xml

  java-services:
    name: Java services tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [mortgage-service, servicing-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - name: Build and test (H2, no PostgreSQL needed)
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.service }}-coverage
          path: services/${{ matrix.service }}/target/site/jacoco/jacoco.xml

  ai-assistant-service:
    name: AI assistant tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai/mortgage-knowledge-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/mortgage-knowledge-assistant/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Tests (builds the vector store from the real corpus, no API key needed)
        run: pytest -v --cov=src --cov-report=term-missing

  data-platform-tests:
    name: M8 data platform tests (Lambda + pipeline)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - infrastructure/aws/lambda/doc-processor
          - infrastructure/data-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Tests (moto-mocked AWS, no live LocalStack or PostgreSQL needed)
        working-directory: ${{ matrix.component }}
        run: pytest -v

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [mortgage-service, servicing-service, analytics-service, ai-assistant]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile.${{ matrix.service }} -t ${{ matrix.service }}:ci .

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run semgrep
        run: |
          docker run --rm -v "$PWD:/src" returntocorp/semgrep:latest \
            semgrep --config=auto --error --severity=ERROR /src/services /src/analytics /src/clients /src/ai /src/infrastructure

  sca-images:
    name: SCA (trivy image scan)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [mortgage-service, servicing-service, analytics-service, ai-assistant]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile.${{ matrix.service }} -t ${{ matrix.service }}:ci .
      - name: Scan image (report-only — see docs/operations/devsecops-baseline.md for why SCA doesn't hard-fail on framework CVEs)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 ${{ matrix.service }}:ci
