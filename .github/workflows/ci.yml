name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks over full history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          comment-summary-in-pr: on-failure

  database:
    name: Migrations + seed on fresh PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - name: Create roles and database
        env:
          PGUSER: postgres
          PGPASSWORD: ci-superuser-password
        run: psql -v ON_ERROR_STOP=1 -v owner_password=ci-owner -v app_password=ci-app -f database/schema/000_roles_and_database.sql
      - name: Apply migrations and seed
        env:
          POSTGRES_OWNER_PASSWORD: ci-owner
        run: bash database/scripts/reset-dev-db.sh
      - name: Migrations are idempotent
        env:
          PGUSER: mortgage_owner
          PGPASSWORD: ci-owner
          PGDATABASE: mortgage_intel
        run: for f in database/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Sample queries run as app role
        env:
          PGUSER: mortgage_app
          PGPASSWORD: ci-app
          PGDATABASE: mortgage_intel
        run: psql -v ON_ERROR_STOP=1 -f database/scripts/sample-queries.sql > /dev/null
      - name: Assert seed invariants
        env:
          PGUSER: mortgage_app
          PGPASSWORD: ci-app
          PGDATABASE: mortgage_intel
        run: |
          check() { got=$(psql -tAc "$1"); [ "$got" = "$2" ] || { echo "FAIL: $1 -> '$got' (expected '$2')"; exit 1; }; echo "ok: $1 = $2"; }
          check "SELECT status FROM mortgage WHERE mortgage_external_id='MTG-1001'" "ACTIVE"
          check "SELECT status FROM mortgage WHERE mortgage_external_id='MTG-1002'" "DELINQUENT"
          check "SELECT days_past_due FROM delinquency d JOIN mortgage m ON m.id=d.mortgage_id WHERE m.mortgage_external_id='MTG-1002'" "45"
          check "SELECT COUNT(*) FROM mortgage" "12"
          check "SELECT COUNT(*) FROM mortgage WHERE status='DELINQUENT'" "3"
          check "SELECT COUNT(*) FROM borrower" "8"
