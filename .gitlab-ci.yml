# Minimal GitLab pipeline (M2 baseline). Mirrors .github/workflows/ci.yml for teams on GitLab.
# Expanded to the full multi-stage pipeline in Milestone 9.

stages:
  - validate
  - test
  - security
  - build

secret_detection:
  stage: validate
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks detect --source . --redact --verbose --exit-code 1

database_migrations:
  stage: validate
  image: postgres:16
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_PASSWORD: ci-superuser-password
    PGHOST: postgres
  script:
    - PGUSER=postgres PGPASSWORD=$POSTGRES_PASSWORD psql -v ON_ERROR_STOP=1 -v owner_password=ci-owner -v app_password=ci-app -f database/schema/000_roles_and_database.sql
    - POSTGRES_HOST=postgres POSTGRES_OWNER_PASSWORD=ci-owner bash database/scripts/reset-dev-db.sh
    - PGUSER=mortgage_app PGPASSWORD=ci-app PGDATABASE=mortgage_intel psql -v ON_ERROR_STOP=1 -f database/scripts/sample-queries.sql > /dev/null
  rules:
    - changes:
        - database/**/*

sca:
  stage: security
  script:
    - echo "Dependency scanning runs in python-test via pip-audit (M3); GitLab Dependency Scanning template added in M9"

docker-build:
  stage: build
  script:
    - echo "Milestone 5+ build and push images; scan in M9"
  when: manual
