# Minimal GitLab pipeline (M2 baseline). Mirrors .github/workflows/ci.yml for teams on GitLab.
# Expanded to the full multi-stage pipeline in Milestone 9.

stages:
  - validate
  - test
  - security
  - build

secret_detection:
  stage: validate
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks detect --source . --redact --verbose --exit-code 1

database_migrations:
  stage: validate
  image: postgres:16
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_PASSWORD: ci-superuser-password
    PGHOST: postgres
  script:
    - PGUSER=postgres PGPASSWORD=$POSTGRES_PASSWORD psql -v ON_ERROR_STOP=1 -v owner_password=ci-owner -v app_password=ci-app -f database/schema/000_roles_and_database.sql
    - POSTGRES_HOST=postgres POSTGRES_OWNER_PASSWORD=ci-owner bash database/scripts/reset-dev-db.sh
    - PGUSER=mortgage_app PGPASSWORD=ci-app PGDATABASE=mortgage_intel psql -v ON_ERROR_STOP=1 -f database/scripts/sample-queries.sql > /dev/null
  rules:
    - changes:
        - database/**/*

python-test:
  stage: test
  image: python:3.11
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_PASSWORD: ci-superuser-password
  before_script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client > /dev/null
    - PGHOST=postgres PGUSER=postgres PGPASSWORD=$POSTGRES_PASSWORD psql -v ON_ERROR_STOP=1 -v owner_password=ci-owner -v app_password=ci-app -f database/schema/000_roles_and_database.sql
    - POSTGRES_HOST=postgres POSTGRES_OWNER_PASSWORD=ci-owner bash database/scripts/reset-dev-db.sh
  script:
    - cd analytics/mortgage-analytics-service
    - pip install -r requirements.txt pip-audit
    - pip-audit -r requirements.txt
    - INTEGRATION_DB=1 POSTGRES_HOST=postgres POSTGRES_PASSWORD=ci-app pytest -v --cov=src --cov-report=term
    - python -m coverage report --include="src/analytics/*,src/services/*" --fail-under=80
  rules:
    - changes:
        - analytics/mortgage-analytics-service/**/*
        - database/**/*

java-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  parallel:
    matrix:
      - SERVICE: [mortgage-service, servicing-service]
  script:
    - cd services/$SERVICE
    - mvn -B verify
  rules:
    - changes:
        - services/**/*

sast:
  stage: security
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/src" returntocorp/semgrep:latest
      semgrep --config=auto --error --severity=ERROR /src/services /src/analytics /src/clients

sca:
  stage: security
  image: docker:27
  services:
    - docker:27-dind
  parallel:
    matrix:
      - SERVICE: [mortgage-service, servicing-service, analytics-service]
  script:
    - docker build -f docker/Dockerfile.$SERVICE -t $SERVICE:ci .
    # Report-only — see docs/operations/devsecops-baseline.md for why SCA doesn't hard-fail on
    # framework CVEs (several current findings require a Spring Boot 4.x major upgrade to fix).
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest
      image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 $SERVICE:ci

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  parallel:
    matrix:
      - SERVICE: [mortgage-service, servicing-service, analytics-service]
  script:
    - docker build -f docker/Dockerfile.$SERVICE -t $SERVICE:ci .
