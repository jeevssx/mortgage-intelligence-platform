spring:
  application:
    name: mortgage-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: com.fasterxml.jackson.databind.util.StdDateFormat
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,readiness,liveness,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}

capstone:
  idempotency:
    enabled: true
  messaging:
    sns-topic-mortgage-events: ${SNS_TOPIC_MORTGAGE_EVENTS:}
    aws-region: ${AWS_REGION:us-east-1}
    aws-endpoint-url: ${AWS_ENDPOINT_URL:}
  security:
    jwt-secret: ${JWT_SECRET:insecure-dev-only-shared-secret-please-override-in-prod-env}
    jwt-issuer: ${JWT_ISSUER:capstone-mortgage-auth}
    jwt-expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}
