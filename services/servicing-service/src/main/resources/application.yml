spring:
  application:
    name: servicing-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,readiness,liveness,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}

capstone:
  messaging:
    sns-topic-mortgage-events: ${SNS_TOPIC_MORTGAGE_EVENTS:}
    sqs-queue-servicing-events: ${SQS_QUEUE_SERVICING_EVENTS:}
    aws-region: ${AWS_REGION:us-east-1}
    aws-endpoint-url: ${AWS_ENDPOINT_URL:}
    poll-delay-ms: ${SQS_POLL_DELAY_MS:2000}
  security:
    jwt-secret: ${JWT_SECRET:insecure-dev-only-shared-secret-please-override-in-prod-env}
  lookup:
    dynamodb-table-mortgage-lookup: ${DYNAMODB_TABLE_MORTGAGE_LOOKUP:}
